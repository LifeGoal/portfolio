<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b1324" />
      <stop offset="100%" stop-color="#0b1324" />
    </linearGradient>
    <linearGradient id="lGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
  </defs>

  <!-- Squircle container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg)" stroke="url(#border)" stroke-width="2.5" />

  <!-- Monogram VL -->
  <text x="32" y="44" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="32" font-weight="900" text-anchor="middle" letter-spacing="-1">
    <tspan fill="#ffffff">V</tspan><tspan fill="url(#lGrad)">L</tspan>
  </text>
</svg>